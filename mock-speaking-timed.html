<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DMI timed Speaking draft</title><link rel="stylesheet" href="dmi-mock.css"><script src="dmi-auth.js" defer></script><script src="dmi-mock-speaking-timed.js" defer></script></head>
<body><main class="mock-shell"><header><img src="dmi-logo.jfif" width="64" alt="DMI"><img src="assets/british-council-registration-partner.png" width="240" alt="British Council IELTS registration partner"><h1>Timed Speaking draft</h1></header>
<p>This private draft records your Speaking answers at each timed stage. Assessment is pending. Keep this page open until all three recordings are acknowledged.</p>
<section id="timed" hidden><p id="status" role="status"></p><label><input type="checkbox" id="consent"> I agree to this mock recording my Speaking answers.</label><p><button id="microphone" type="button">Check microphone access</button> <button id="start" type="button" disabled>Start timed Speaking</button> <button id="resume" type="button">Resume timing</button></p>
<h2 id="phase"></h2><p id="remaining" aria-live="off"></p><p id="prompt" style="white-space:pre-wrap"></p><p id="recording-status" role="status"></p><button id="retry-uploads" type="button" hidden>Retry saved uploads</button><section id="clips" aria-label="Recordings"></section><p>Unsaved recordings stay on this page. Refreshing or closing before acknowledgement loses them. Assessment pending.</p></section></main></body></html>
